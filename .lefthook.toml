# GitGuardian secret scan on staged changes (advent-of-code puzzle inputs,
# session cookies, etc. must never reach the remote).
#
# ggshield comes from the machine-global mise config (or from this repo's
# `mise install`), and the job is skipped on machines that do not have it.
# The hook itself is wired by the `lefthook install` postinstall in .mise.toml.
[pre-commit]
skip = ["merge", "rebase"]

[pre-commit.commands.ggshield]
run = "ggshield secret scan pre-commit"
skip = [{ run = "! command -v ggshield >/dev/null 2>&1" }]
